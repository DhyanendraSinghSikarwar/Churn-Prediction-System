[project]
name = "churn-prediction"
version = "0.1.0"
description = "Production-style customer churn prediction system (Postgres + SQL features + MLflow + FastAPI)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Dhyanendra Singh", email = "dhyanendra_singh@isb.edu" }]

dependencies = [
    "sqlalchemy>=2.0.29",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "pandas>=2.2.1",
    "numpy>=1.26.4",
    "python-dateutil>=2.9.0",
    "requests>=2.31.0",
    "tqdm>=4.66.2",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.2",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.12",
    "pandas-stubs>=2.2.1",
    "testcontainers[postgres]>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["E203"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# Pinned to the actual dev/CI interpreter (3.12), not the requires-python
# floor (3.11) — numpy's bundled stubs use PEP 695 syntax that mypy only
# parses under python_version >= 3.12.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["notebooks/", "alembic/versions/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src/churn --cov-report=term-missing"
markers = [
    "integration: requires Docker (spins up real containers via testcontainers)",
]

[tool.coverage.run]
source = ["src/churn"]
omit = ["*/__init__.py"]
