# Local hooks that shell out to `uv run ...` rather than pinning
# separate hook-repo versions (ruff-pre-commit, mirrors-mypy, etc.) --
# keeps pre-commit using the exact same tool versions this project's
# own dev-group (pyproject.toml) and CLAUDE.md's documented commands
# already use, with one version to keep current, not two.
#
# `files` restricts every hook to exactly the directories CLAUDE.md's
# lint commands cover (src/tests/pipelines/api/dashboards) -- NOT
# `alembic/versions/` (autogenerated migrations; reformatting an
# already-applied migration is exactly the kind of "never hand-edit a
# generated file" this project avoids elsewhere) or `notebooks/`
# (excluded from mypy for the same PEP-695-stub reason pyproject.toml
# documents, and not something a routine commit should silently
# reformat). Found the hard way: an earlier, unscoped version of this
# file let black rewrite two committed Alembic migrations on a bare
# `pre-commit run --all-files` verification pass.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^(src|tests|pipelines|api|dashboards)/
        require_serial: true

      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
        files: ^(src|tests|pipelines|api|dashboards)/
        require_serial: true

      - id: mypy
        name: mypy --strict (src, pipelines, api, dashboards)
        entry: uv run mypy src pipelines api dashboards
        language: system
        types: [python]
        files: ^(src|pipelines|api|dashboards)/
        pass_filenames: false
        require_serial: true
